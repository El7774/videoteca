<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videoteca — I tuoi film, serie e anime preferiti</title>

<script>
  // Guardia di accesso: questa è una schermata di passaggio dopo il login,
  // non una pagina pubblica — senza token si torna alla pagina di login.
  if (!localStorage.getItem('videoteca-token') && !sessionStorage.getItem('videoteca-token')) {
    window.location.replace('index.html');
  }
  // Applica il tema scelto dall'utente nel Profilo, per coerenza con il resto dell'app
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="stylesheet" href="styles.css?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Bebas Neue', 'sans-serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  };
</script>

<style>
  html, body { background: var(--bg); font-family: 'Inter', sans-serif; }
  ::selection { background: rgba(var(--orange-rgb), 0.4); }

  /* Sfondo pagina: stesso wash cinematico a due toni usato nel resto dell'app */
  body{
    background-image:
      radial-gradient(circle at 10% 0%, rgba(var(--wash-1-rgb),0.14), transparent 42%),
      radial-gradient(circle at 90% 15%, rgba(var(--wash-2-rgb),0.16), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(var(--wash-1-rgb),0.08), transparent 50%);
    background-attachment: fixed;
  }

  /* ---------- Logo neon con leggero sfarfallio da insegna ---------- */
  .neon-logo{
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 6px;
    color: var(--text);
    text-shadow:
      0 0 8px rgba(var(--orange-rgb), 0.85),
      0 0 22px rgba(var(--orange-rgb), 0.55),
      0 0 50px rgba(var(--teal-rgb), 0.45),
      0 0 100px rgba(var(--teal-rgb), 0.3);
    animation: neonFlicker 5s ease-in-out infinite;
  }
  @keyframes neonFlicker{
    0%, 19%, 21%, 23%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 55% { opacity: 0.85; }
  }
  @media (prefers-reduced-motion: reduce){
    .neon-logo{ animation: none; }
  }

  .glass{
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .glass-raised{
    background: var(--panel-raised);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ---------- Carousel ---------- */
  #carouselTrack{
    display: flex;
    transition: transform 0.55s cubic-bezier(.65,0,.35,1);
    will-change: transform;
  }
  .carousel-slide{ flex: 0 0 100%; padding: 0 10px; }
  @media (min-width: 640px){ .carousel-slide{ flex-basis: 50%; } }
  @media (min-width: 1024px){ .carousel-slide{ flex-basis: 33.3333%; } }

  .showcase-card{
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .showcase-card:hover{
    transform: translateY(-4px);
  }

  .dot{
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--line);
    transition: background 0.2s ease, width 0.2s ease;
  }
  .dot.active{ background: var(--orange); width: 22px; }

  .heart-toggle{ color: var(--muted); transition: color 0.15s ease, transform 0.15s ease; }
  .heart-toggle:hover{ transform: scale(1.15); }
  .heart-toggle.liked{ color: var(--crimson); }

  .cover-tile{
    background: linear-gradient(135deg, rgba(var(--orange-rgb),0.18), rgba(var(--teal-rgb),0.18));
  }

  /* ---------- Barra di caricamento in cima alla pagina ---------- */
  #loadingBar{
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--teal));
    z-index: 60;
    transition: width linear;
  }

  /* ---------- Centro animato: bobina di pellicola + icone cinema/anime ---------- */
  .reel{ width: 92px; height: 92px; margin: 0 auto; animation: reelSpin 2s linear infinite; }
  @keyframes reelSpin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .reel{ animation: none; } }
  .reel-track{ stroke: var(--line); }
  .reel-dash{ stroke: var(--orange); }
  .reel-hub{ fill: var(--panel-raised); stroke: var(--teal); }
  .reel-hole-a{ fill: var(--panel-raised); stroke: var(--orange); }
  .reel-hole-b{ fill: var(--panel-raised); stroke: var(--teal); }

  .loading-icons{ display:flex; align-items:center; justify-content:center; gap: 20px; margin-top: 14px; font-size: 20px; }
  .loading-icons i{ display:inline-block; color: var(--muted); animation: iconBob 1.5s ease-in-out infinite; }
  .loading-icons i:nth-child(1){ animation-delay: 0s; color: var(--orange); }
  .loading-icons i:nth-child(2){ animation-delay: 0.18s; color: var(--teal); }
  .loading-icons i:nth-child(3){ animation-delay: 0.36s; color: var(--crimson); }
  .loading-icons i:nth-child(4){ animation-delay: 0.54s; color: var(--orange); }
  @keyframes iconBob{ 0%, 100%{ transform: translateY(0); opacity:0.65; } 50%{ transform: translateY(-7px); opacity:1; } }

  .loading-progress-track{ width: 260px; max-width: 70vw; height: 8px; margin: 22px auto 10px; border-radius: 999px; background: var(--panel-raised); border: 1px solid var(--line); overflow: hidden; }
  .loading-progress-fill{ height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--orange), var(--teal)); }
  .loading-percent{ font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); }
  .loading-message{ font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 16px; }
</style>
</head>
<body class="min-h-screen text-[var(--text)]">

  <div id="loadingBar"></div>

  <!-- ================= HEADER ================= -->
  <header class="sticky top-0 z-40 glass">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">

      <div class="flex items-center gap-2 shrink-0">
        <i class="fa-solid fa-clapperboard text-[var(--orange)]"></i>
        <span class="font-display text-xl tracking-wide">VIDEOTECA</span>
      </div>

      <div id="greeting" class="text-sm text-[var(--muted)]"></div>
    </div>
  </header>

  <!-- ================= HERO ================= -->
  <section class="max-w-6xl mx-auto px-5 sm:px-8 pt-20 pb-16 text-center">
    <h1 class="neon-logo text-5xl sm:text-7xl lg:text-8xl font-normal">VIDEOTECA</h1>
    <p class="mt-6 text-base sm:text-lg text-[var(--muted)] max-w-xl mx-auto">
      I tuoi film, serie e anime preferiti in un unico posto
    </p>

    <div class="mt-9">
      <div class="reel">
        <svg viewBox="0 0 100 100">
          <circle class="reel-track" cx="50" cy="50" r="46" fill="none" stroke-width="4"/>
          <circle class="reel-dash" cx="50" cy="50" r="46" fill="none" stroke-width="4" stroke-dasharray="16 10" stroke-linecap="round"/>
          <circle class="reel-hub" cx="50" cy="50" r="10" stroke-width="3"/>
          <circle class="reel-hole-a" cx="50" cy="20" r="8.5" stroke-width="2.5"/>
          <circle class="reel-hole-b" cx="76" cy="65" r="8.5" stroke-width="2.5"/>
          <circle class="reel-hole-a" cx="24" cy="65" r="8.5" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="loading-icons">
        <i class="fa-solid fa-clapperboard"></i>
        <i class="fa-solid fa-tv"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-dragon"></i>
      </div>
      <div class="loading-progress-track">
        <div class="loading-progress-fill" id="centerProgressFill"></div>
      </div>
      <p class="loading-percent" id="centerProgressPercent">0%</p>
      <p class="loading-message" id="loadingText">Riavvolgendo le pellicole…</p>
    </div>
  </section>

  <!-- ================= COSA GUARDIAMO OGGI ================= -->
  <section class="max-w-6xl mx-auto px-5 sm:px-8 py-14">
    <div class="mb-8">
      <p class="font-mono text-xs tracking-[3px] text-[var(--orange)] mb-2">IN TENDENZA</p>
      <h2 class="font-display text-3xl sm:text-4xl tracking-wide">Cosa guardiamo oggi</h2>
    </div>

    <div class="relative">
      <div class="overflow-hidden">
        <div id="carouselTrack"></div>
      </div>

      <button id="prevBtn" aria-label="Precedente" class="hidden sm:flex absolute -left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass-raised items-center justify-center hover:border-[var(--orange)] transition">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button id="nextBtn" aria-label="Successivo" class="hidden sm:flex absolute -right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass-raised items-center justify-center hover:border-[var(--orange)] transition">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="flex items-center justify-center gap-2 mt-6" id="dotsWrap"></div>

    <div class="flex justify-center mt-8 sm:hidden gap-3">
      <button id="prevBtnMobile" class="w-10 h-10 rounded-full glass-raised flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
      <button id="nextBtnMobile" class="w-10 h-10 rounded-full glass-raised flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </section>

  <!-- ================= I TUOI SALVATI (solo se loggato) ================= -->
  <section id="salvati" class="max-w-6xl mx-auto px-5 sm:px-8 py-14 hidden">
    <div class="mb-8">
      <p class="font-mono text-xs tracking-[3px] text-[var(--teal)] mb-2">LA TUA LIBRERIA</p>
      <h2 class="font-display text-3xl sm:text-4xl tracking-wide">I tuoi salvati</h2>
    </div>
    <div id="savedGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4"></div>
    <div class="mt-8">
      <a href="homepage.html" class="inline-flex items-center gap-2 glass-raised text-sm font-semibold px-5 py-2.5 rounded-full hover:border-[var(--teal)] transition">
        Vedi tutti i salvati <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="border-t border-[var(--line)] mt-10">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-8 flex items-center justify-center gap-2">
      <i class="fa-solid fa-clapperboard text-[var(--orange)] text-sm"></i>
      <span class="font-display text-base tracking-wide">VIDEOTECA</span>
    </div>
  </footer>

  <!-- ================= MODALE DETTAGLIO ================= -->
  <div id="cardModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="glass-raised rounded-2xl max-w-lg w-full p-6 relative">
      <button id="modalClose" class="absolute top-3 right-3 w-8 h-8 rounded-full glass flex items-center justify-center" aria-label="Chiudi">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalCover" class="cover-tile w-20 h-20 rounded-xl flex items-center justify-center text-3xl mb-4"></div>
      <div class="flex items-center gap-3 mb-2">
        <span id="modalType" class="font-mono text-xs tracking-widest px-2 py-0.5 rounded-full border border-[var(--line)]"></span>
        <span id="modalYear" class="font-mono text-xs text-[var(--muted)]"></span>
      </div>
      <h3 id="modalTitle" class="font-display text-2xl tracking-wide mb-2"></h3>
      <p id="modalDesc" class="text-sm text-[var(--muted)] mb-5"></p>
      <button id="modalTrailerBtn" class="glass-raised text-sm font-semibold px-5 py-2.5 rounded-full hover:border-[var(--orange)] transition">
        <i class="fa-solid fa-play"></i> Guarda il trailer
      </button>
    </div>
  </div>

  <script>
  (function () {
    // =========================================================
    // Dati showcase (contenuto statico della pagina di benvenuto)
    // =========================================================
    const TYPE_STYLES = {
      film: 'color:var(--crimson)',
      serie: 'color:var(--teal)',
      anime: 'color:var(--orange)'
    };

    const showcaseItems = [
      { type: 'film', icon: 'fa-film', title: 'Blade Runner 2049', year: '2017', desc: 'Un giovane blade runner scopre un segreto sepolto da decenni.' },
      { type: 'serie', icon: 'fa-tv', title: 'Breaking Bad', year: '2008–2013', desc: 'La trasformazione di un insegnante in produttore di metanfetamina.' },
      { type: 'anime', icon: 'fa-dragon', title: 'Attack on Titan', year: '2013–2023', desc: "L'umanità si rifugia dietro enormi mura contro i Titani." },
      { type: 'film', icon: 'fa-film', title: 'Interstellar', year: '2014', desc: 'Un viaggio oltre le stelle per salvare l\'umanità.' },
      { type: 'serie', icon: 'fa-tv', title: 'Dark', year: '2017–2020', desc: 'Quattro famiglie, una piccola città e un mistero che attraversa il tempo.' },
      { type: 'anime', icon: 'fa-dragon', title: 'Fullmetal Alchemist: Brotherhood', year: '2009–2010', desc: 'Due fratelli alchimisti cercano la Pietra Filosofale.' }
    ];

    // =========================================================
    // Carousel "Cosa guardiamo oggi"
    // =========================================================
    const track = document.getElementById('carouselTrack');
    const dotsWrap = document.getElementById('dotsWrap');
    let currentSlide = 0;
    let autoTimer = null;

    function renderCarousel(){
      track.innerHTML = showcaseItems.map((item, i) => `
        <div class="carousel-slide">
          <div class="showcase-card glass rounded-2xl overflow-hidden cursor-pointer h-full flex flex-col" data-index="${i}">
            <div class="cover-tile h-40 flex items-center justify-center text-4xl relative">
              <i class="fa-solid ${item.icon}" style="${TYPE_STYLES[item.type]}"></i>
              <button type="button" class="heart-toggle absolute top-3 right-3" title="Preferito" aria-label="Preferito">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>
            <div class="p-4 flex flex-col gap-1 flex-1">
              <div class="flex items-center justify-between">
                <span class="font-mono text-xs tracking-widest text-[var(--muted)]">${item.type.toUpperCase()}</span>
                <span class="font-mono text-xs text-[var(--muted)]">${item.year}</span>
              </div>
              <h3 class="font-display text-xl tracking-wide">${item.title}</h3>
            </div>
          </div>
        </div>
      `).join('');

      dotsWrap.innerHTML = showcaseItems.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" data-dot="${i}"></span>`).join('');

      track.querySelectorAll('.showcase-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.heart-toggle')) {
            e.target.closest('.heart-toggle').classList.toggle('liked');
            return;
          }
          openModal(parseInt(card.dataset.index, 10));
        });
      });

      dotsWrap.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.dot, 10)));
      });
    }

    function slidesPerView(){
      if (window.innerWidth >= 1024) return 3;
      if (window.innerWidth >= 640) return 2;
      return 1;
    }

    function maxIndex(){ return Math.max(0, showcaseItems.length - slidesPerView()); }

    function updateCarousel(){
      const slide = track.querySelector('.carousel-slide');
      if (!slide) return;
      const slideWidth = slide.getBoundingClientRect().width;
      track.style.transform = `translateX(-${currentSlide * slideWidth}px)`;
      dotsWrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    function goToSlide(i){
      currentSlide = Math.min(Math.max(i, 0), maxIndex());
      updateCarousel();
    }

    function nextSlide(){ goToSlide(currentSlide >= maxIndex() ? 0 : currentSlide + 1); }
    function prevSlide(){ goToSlide(currentSlide <= 0 ? maxIndex() : currentSlide - 1); }

    function startAutoplay(){
      clearInterval(autoTimer);
      autoTimer = setInterval(nextSlide, 4000);
    }

    document.getElementById('nextBtn').onclick = () => { nextSlide(); startAutoplay(); };
    document.getElementById('prevBtn').onclick = () => { prevSlide(); startAutoplay(); };
    document.getElementById('nextBtnMobile').onclick = () => { nextSlide(); startAutoplay(); };
    document.getElementById('prevBtnMobile').onclick = () => { prevSlide(); startAutoplay(); };

    const carouselWrap = track.closest('section');
    carouselWrap.addEventListener('mouseenter', () => clearInterval(autoTimer));
    carouselWrap.addEventListener('mouseleave', startAutoplay);

    window.addEventListener('resize', updateCarousel);

    renderCarousel();
    updateCarousel();
    startAutoplay();

    // =========================================================
    // Modale dettaglio
    // =========================================================
    const modal = document.getElementById('cardModal');
    function openModal(i){
      const item = showcaseItems[i];
      document.getElementById('modalCover').innerHTML = `<i class="fa-solid ${item.icon}" style="${TYPE_STYLES[item.type]}"></i>`;
      document.getElementById('modalType').textContent = item.type.toUpperCase();
      document.getElementById('modalType').style.cssText += ';' + TYPE_STYLES[item.type];
      document.getElementById('modalYear').textContent = item.year;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDesc').textContent = item.desc;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeModal(){
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    document.getElementById('modalClose').onclick = closeModal;
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('modalTrailerBtn').onclick = () => {
      document.getElementById('modalTrailerBtn').innerHTML = '<i class="fa-solid fa-circle-info"></i> Trailer in arrivo prossimamente';
    };

    // =========================================================
    // Saluto e stato di accesso — questa pagina è già "protetta"
    // dalla guardia in testa al file, quindi qui l'utente è sempre loggato.
    // =========================================================
    const TOKEN_KEY = 'videoteca-token';
    const USERNAME_KEY = 'videoteca-username';

    // ATTENZIONE: sostituisci questo indirizzo con l'URL del tuo server
    // dopo averlo pubblicato su Render (stessa riga già vista negli altri file).
    const API_BASE = 'https://videoteca-backend.onrender.com/api';

    function getToken(){
      return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
    }
    function getStoredUsername(){
      return localStorage.getItem(USERNAME_KEY) || sessionStorage.getItem(USERNAME_KEY);
    }
    // Escape HTML: trasforma i caratteri speciali (<, >, &, ") in entità sicure,
    // così un username contenente codice HTML/JS non può essere eseguito.
    // Stessa funzione già usata in search.html, homepage.html e profilo.html.
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const username = getStoredUsername();
    const greetingEl = document.getElementById('greeting');
    if (greetingEl && username) {
      greetingEl.innerHTML = `Bentornato, <strong class="text-[var(--text)]">${escapeHtml(username)}</strong>`;
    }

    // =========================================================
    // Redirect automatico alla homepage dopo il caricamento (5 secondi netti)
    // =========================================================
    const REDIRECT_AFTER_MS = 5000;
    const loadingBar = document.getElementById('loadingBar');
    const centerFill = document.getElementById('centerProgressFill');
    const centerPercent = document.getElementById('centerProgressPercent');
    const loadingTextEl = document.getElementById('loadingText');
    let redirected = false;

    function goToHomepage(){
      if (redirected) return;
      redirected = true;
      window.location.href = 'homepage.html';
    }

    // Le due barre si riempiono con una transizione CSS sincronizzata con il timer
    requestAnimationFrame(() => {
      loadingBar.style.transitionDuration = REDIRECT_AFTER_MS + 'ms';
      loadingBar.style.width = '100%';
      centerFill.style.transition = 'width ' + REDIRECT_AFTER_MS + 'ms linear';
      centerFill.style.width = '100%';
    });

    // Percentuale numerica sincronizzata con la stessa durata
    const progressStart = performance.now();
    function tickPercent(now){
      const elapsed = now - progressStart;
      const pct = Math.min(100, Math.round((elapsed / REDIRECT_AFTER_MS) * 100));
      centerPercent.textContent = pct + '%';
      if (elapsed < REDIRECT_AFTER_MS && !redirected) {
        requestAnimationFrame(tickPercent);
      }
    }
    requestAnimationFrame(tickPercent);

    // Messaggi a tema film/serie/anime, in rotazione durante il caricamento
    const loadingMessages = [
      'Riavvolgendo le pellicole…',
      'Sincronizzando le stagioni…',
      'Preparando gli anime preferiti…',
      'Quasi pronto…'
    ];
    let msgIndex = 0;
    const msgInterval = setInterval(() => {
      msgIndex = (msgIndex + 1) % loadingMessages.length;
      loadingTextEl.textContent = loadingMessages[msgIndex];
    }, REDIRECT_AFTER_MS / loadingMessages.length);

    const redirectTimer = setTimeout(goToHomepage, REDIRECT_AFTER_MS);

    document.querySelectorAll('a[href="homepage.html"]').forEach(a => {
      a.addEventListener('click', () => { clearTimeout(redirectTimer); clearInterval(msgInterval); });
    });

    // =========================================================
    // "I tuoi salvati" — dati reali dal database, solo se loggato
    // =========================================================
    async function loadSavedSection(){
      const token = getToken();
      const section = document.getElementById('salvati');
      if (!token) { section.classList.add('hidden'); return; }

      try {
        const res = await fetch(API_BASE + '/shows', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Sessione non valida');
        const shows = await res.json();

        if (!Array.isArray(shows) || shows.length === 0) {
          section.classList.add('hidden');
          return;
        }

        const grid = document.getElementById('savedGrid');
        grid.innerHTML = shows.slice(0, 6).map(show => `
          <div class="glass rounded-xl overflow-hidden">
            <div class="cover-tile h-24 flex items-center justify-center text-2xl">
              <i class="fa-solid ${show.type === 'film' ? 'fa-film' : 'fa-tv'}" style="color:${show.type === 'film' ? 'var(--crimson)' : 'var(--teal)'}"></i>
            </div>
            <p class="text-xs font-semibold px-3 py-2 truncate">${escapeHtml(show.title || '')}</p>
          </div>
        `).join('');

        section.classList.remove('hidden');
      } catch (e) {
        section.classList.add('hidden');
      }
    }
    loadSavedSection();
  })();
  </script>

</body>
</html>

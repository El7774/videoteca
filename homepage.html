<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videoteca — la mia collezione</title>
<script>
  // Guardia di accesso: senza un token salvato si torna al login
  if (!localStorage.getItem('videoteca-token') && !sessionStorage.getItem('videoteca-token')) {
    window.location.replace('index.html');
  }
  // Applica il tema scelto dall'utente (letto localmente per evitare lo sfarfallio iniziale)
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="styles.css?v=5">

</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="homepage.html" class="topnav-logo">vid<span class="clapper" aria-hidden="true"><svg viewBox="0 0 24 24" class="clapper-svg">
      <rect x="2" y="11" width="20" height="10" rx="2" class="clapper-base"/>
      <rect x="2" y="3" width="20" height="7" rx="1.5" class="clapper-arm">
        <animateTransform attributeName="transform" type="rotate" values="0 3 11; -24 3 11; 0 3 11" keyTimes="0;0.4;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="3" cy="11" r="1.3" class="clapper-hinge"/>
    </svg></span>oteca</a>

    <div class="topnav-links">
      <a href="homepage.html" class="topnav-link active" id="navBoard">Board</a>
      <a href="#" class="topnav-link" id="navMovies">Movies</a>
      <a href="#" class="topnav-link" id="navSeries">Series</a>
      <a href="#" class="topnav-link" id="navStats">Statistiche</a>
    </div>

    <form class="topnav-search" id="onlineSearchForm">
      <span class="online-search-icon">🔍</span>
      <input type="search" id="onlineSearchInput" placeholder="Search" enterkeyhint="search" autocomplete="off">
      <div class="online-search-live" id="onlineSearchLive" style="display:none;"></div>
    </form>

    <div class="topnav-user">
      <label class="avatar-upload" id="avatarUpload" title="Cambia foto profilo">
        <img class="avatar-img" id="avatarImg" alt="">
        <span class="avatar-initial" id="avatarInitial"></span>
        <input type="file" accept="image/*" id="avatarInput" hidden>
      </label>
      <a href="profilo.html" class="profile-link topnav-username"><strong id="sessionUserName"></strong></a>
    </div>
  </div>
</nav>

<script>
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.clapper-arm animateTransform').forEach(el => el.remove());
  }
</script>

<div class="wrap">

  <div class="now-watching-section" id="nowWatchingSection">
    <div class="now-watching-hero" id="nowWatchingHero"></div>
    <div class="now-watching-side">
      <div class="now-watching-panel">
        <h3 class="now-watching-side-title">Episodi successivi</h3>
        <div class="now-watching-episodes" id="nowWatchingEpisodes"></div>
      </div>
      <div class="now-watching-panel">
        <h3 class="now-watching-side-title">In corso</h3>
        <div class="now-watching-items" id="nowWatchingItems"></div>
      </div>
    </div>
  </div>

  <div class="favorites-section" id="favoritesSection">
    <div class="favorites-header" id="favoritesHeader">
      <h2>Preferiti</h2>
      <span class="favorites-count" id="favoritesCount">0</span>
      <div class="favorites-nav-arrows">
        <button class="favorites-arrow" id="favoritesPrev" title="Precedente" aria-label="Precedente">‹</button>
        <button class="favorites-arrow" id="favoritesNext" title="Successivo" aria-label="Successivo">›</button>
      </div>
    </div>
    <div class="favorites-carousel" id="favoritesGrid"></div>
  </div>

  <div class="genres-section" id="genresSection">
    <div class="genres-header"><h2>Generi Popolari</h2></div>
    <div class="genres-carousel" id="genresCarousel"></div>
  </div>

  <div class="trending-section" id="trendingTvSection">
    <div class="trending-header"><h2>Serie TV del momento</h2></div>
    <div class="trending-carousel" id="trendingTvCarousel"></div>
  </div>

  <div class="trending-section" id="trendingMoviesSection">
    <div class="trending-header"><h2>Film del momento</h2></div>
    <div class="trending-carousel" id="trendingMoviesCarousel"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="confirmOverlay" style="display:none;">
  <div class="modal">
    <h2>Conferma</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmNo">Annulla</button>
      <button class="btn primary" id="confirmYes">Conferma</button>
    </div>
  </div>
</div>

<div id="celebrationLayer"></div>

<script>
(function(){
  // ATTENZIONE: sostituisci questo indirizzo con l'URL del tuo server
  // dopo averlo pubblicato su Render (vedi la guida ricevuta in chat).
  const API_BASE = 'https://videoteca-backend.onrender.com/api';

  function getToken(){
    return localStorage.getItem('videoteca-token') || sessionStorage.getItem('videoteca-token');
  }
  function getStoredUsername(){
    return localStorage.getItem('videoteca-username') || sessionStorage.getItem('videoteca-username');
  }
  function redirectToLogin(){
    localStorage.removeItem('videoteca-token'); sessionStorage.removeItem('videoteca-token');
    localStorage.removeItem('videoteca-username'); sessionStorage.removeItem('videoteca-username');
    window.location.replace('index.html');
  }

  async function apiFetch(path, options = {}){
    const token = getToken();
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if(token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
    let data = null;
    try{ data = await res.json(); }catch(e){ /* risposta vuota */ }
    if(!res.ok){
      const err = new Error((data && data.error) || ('Errore del server (' + res.status + ').'));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  let shows = [];
  let mediaFilter = 'all';
  const toggledIds = new Set();
  const seasonEpisodeNamesCache = new Map(); // 'tvId:season' -> Promise<{[episodeNumber]: {name, stillUrl, runtime}}>

  function getSeasonEpisodeNames(tvId, season){
    const key = tvId + ':' + season;
    if(seasonEpisodeNamesCache.has(key)) return seasonEpisodeNamesCache.get(key);
    const promise = apiFetch('/catalog/episodes?tvId=' + encodeURIComponent(tvId) + '&season=' + season)
      .then(list => {
        const map = {};
        (list || []).forEach(e => { if(e && e.episodeNumber) map[e.episodeNumber] = e; });
        return map;
      })
      .catch(() => {
        seasonEpisodeNamesCache.delete(key); // fallita: non tenere in cache un fallimento, riprova al prossimo render
        return null;
      });
    seasonEpisodeNamesCache.set(key, promise);
    return promise;
  }

  // Per i titoli aggiunti prima che salvassimo il tmdbId, lo recupera cercando
  // il titolo su TMDB e lo salva sulla scheda per non doverlo rifare in futuro.
  const tmdbIdResolveCache = new Map(); // titolo -> Promise<tmdbId|null>, evita ricerche duplicate in parallelo
  async function resolveTmdbId(show){
    if(show.tmdbId) return show.tmdbId;
    const key = show.title.trim().toLowerCase();
    if(tmdbIdResolveCache.has(key)) return tmdbIdResolveCache.get(key);

    const promise = apiFetch('/catalog/search?query=' + encodeURIComponent(show.title))
      .then(results => {
        const tvResults = (results || []).filter(r => r.mediaType === 'tv');
        if(tvResults.length === 0) return null;
        const exact = tvResults.find(r => r.title.trim().toLowerCase() === key);
        const chosen = exact || tvResults[0];
        show.tmdbId = chosen.tmdbId;
        saveShows();
        return chosen.tmdbId;
      })
      .catch(() => {
        tmdbIdResolveCache.delete(key);
        return null;
      });
    tmdbIdResolveCache.set(key, promise);
    return promise;
  }

  // ---- "Del momento" (serie TV e film di tendenza da TMDB, non legati alla collezione) ----
  const trendingCache = {}; // 'tv'|'movie' -> Promise<risultati|null>, una sola richiesta per sessione

  function fetchTrending(type){
    if(trendingCache[type]) return trendingCache[type];
    const promise = apiFetch('/catalog/trending?type=' + type)
      .catch((err) => {
        console.error('Errore nel caricamento dei contenuti di tendenza (' + type + '): [' + (err && err.status) + '] ' + (err && err.message));
        delete trendingCache[type]; // fallita: riprova al prossimo render invece di restare bloccati su null
        return null;
      });
    trendingCache[type] = promise;
    return promise;
  }

  function buildTrendingCard(item){
    const card = document.createElement('div');
    card.className = 'trending-card';
    card.innerHTML = `
      <div class="trending-poster">${item.posterUrl ? `<img src="${item.posterUrl}" alt="" loading="lazy">` : '🎬'}</div>
      ${item.rating ? `<span class="trending-rating">★ ${item.rating}</span>` : ''}
      <div class="trending-title">${escapeHtml(item.title)}${item.year ? ` <span class="trending-year">(${escapeHtml(item.year)})</span>` : ''}</div>
    `;
    return card;
  }

  const trendingRendered = { tv: false, movie: false }; // già costruito in DOM: non ripetere il fetch/render ad ogni render()

  function renderTrendingType(type, section, carousel){
    if(trendingRendered[type]){
      section.style.display = 'block';
      return;
    }
    fetchTrending(type).then(results => {
      if(!results || results.length === 0){ section.style.display = 'none'; return; }
      trendingRendered[type] = true;
      section.style.display = 'block';
      carousel.innerHTML = '';
      results.forEach(item => carousel.appendChild(buildTrendingCard(item)));
    });
  }

  function renderTrending(){
    const tvSection = document.getElementById('trendingTvSection');
    const moviesSection = document.getElementById('trendingMoviesSection');

    if(mediaFilter !== 'all'){
      tvSection.style.display = 'none';
      moviesSection.style.display = 'none';
      return;
    }

    renderTrendingType('tv', tvSection, document.getElementById('trendingTvCarousel'));
    renderTrendingType('movie', moviesSection, document.getElementById('trendingMoviesCarousel'));
  }

  // ---- "Generi Popolari" (da TMDB, non legati alla collezione) ----
  // Colore tema per ciascun genere (r,g,b), stesso ID usato dal backend in POPULAR_GENRES.
  const GENRE_TINTS = {
    28: '224,64,45',     // Azione — rosso fuoco
    35: '235,169,42',    // Commedia — giallo/ambra
    18: '58,79,138',     // Dramma — blu notte
    27: '69,32,84',      // Horror — viola scuro
    10749: '214,73,122', // Romantico — rosa
    878: '32,150,178',   // Fantascienza — ciano
    16: '214,111,42',    // Animazione — arancio caldo
    80: '120,30,30',     // Crime — rosso scuro
    14: '58,140,90',     // Fantasy — verde smeraldo
    99: '75,99,101'      // Documentario — grigio-teal
  };

  let genresRendered = false; // già costruito in DOM: non ripetere il fetch/render ad ogni render()
  let genresPromise = null;

  function fetchGenres(){
    if(genresPromise) return genresPromise;
    genresPromise = apiFetch('/catalog/genres')
      .catch(() => {
        genresPromise = null; // fallita: riprova al prossimo render
        return null;
      });
    return genresPromise;
  }

  function buildGenreCard(genre){
    const card = document.createElement('div');
    card.className = 'genre-card';
    card.style.setProperty('--genre-tint', GENRE_TINTS[genre.id] || '120,120,120');
    if(genre.backdropUrl) card.style.backgroundImage = `url("${genre.backdropUrl}")`;
    card.innerHTML = `<span class="genre-card-name">${escapeHtml(genre.name)}</span>`;
    return card;
  }

  function renderGenres(){
    const section = document.getElementById('genresSection');

    if(mediaFilter !== 'all'){
      section.style.display = 'none';
      return;
    }
    if(genresRendered){
      section.style.display = 'block';
      return;
    }

    fetchGenres().then(genres => {
      if(!genres || genres.length === 0){ section.style.display = 'none'; return; }
      genresRendered = true;
      section.style.display = 'block';
      const carousel = document.getElementById('genresCarousel');
      carousel.innerHTML = '';
      genres.forEach(genre => carousel.appendChild(buildGenreCard(genre)));
    });
  }

  function isCardExpanded(show){
    const defaultExpanded = false;
    return toggledIds.has(show.id) ? !defaultExpanded : defaultExpanded;
  }

  function showConfirm(message, onYes){
    const el = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    el.style.display = 'flex';
    const yesBtn = document.getElementById('confirmYes');
    const noBtn = document.getElementById('confirmNo');
    const cleanup = () => { el.style.display = 'none'; yesBtn.onclick = null; noBtn.onclick = null; el.onclick = null; };
    yesBtn.onclick = () => { cleanup(); onYes(); };
    noBtn.onclick = () => { cleanup(); };
    el.onclick = (e) => { if(e.target === el) cleanup(); };
  }

  function showNotice(message){
    const t = document.createElement('div');
    t.className = 'notice-toast';
    t.textContent = message;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function celebrate(kind, title){
    const layer = document.getElementById('celebrationLayer');
    const count = kind === 'series' ? 70 : (kind === 'season' ? 45 : 30);
    const colors = ['var(--orange)', 'var(--crimson)', 'var(--teal)', '#F2EDE4'];
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random()*100) + '%';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      p.style.animationDuration = (1.5 + Math.random()*1.3) + 's';
      p.style.animationDelay = (Math.random()*0.35) + 's';
      layer.appendChild(p);
      setTimeout(() => p.remove(), 3300);
    }
    const messages = {
      film: '🎬 Film completato',
      season: '📀 Stagione completata',
      series: '🏆 Serie completata'
    };
    const toast = document.createElement('div');
    toast.className = 'celebration-toast ' + kind;
    toast.innerHTML = `<strong>${messages[kind]}</strong><span>${escapeHtml(title)}</span>`;
    layer.appendChild(toast);
    setTimeout(() => toast.remove(), 2900);
  }

  async function loadShows(){
    try{
      const data = await apiFetch('/shows');
      shows = Array.isArray(data) ? data : [];
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      console.error('Errore nel caricamento della collezione', e);
      shows = [];
      showNotice('Impossibile contattare il server. Riprova più tardi.');
    }
    ensureLastModified();
  }

  function ensureLastModified(){
    const now = Date.now();
    shows.forEach(s => {
      if(!s.lastModifiedAt) s.lastModifiedAt = now;
      if(typeof s.favorite !== 'boolean') s.favorite = false;
    });
  }

  function saveShows(){
    apiFetch('/shows', { method:'PUT', body: JSON.stringify(shows) })
      .catch(e => {
        if(e.status === 401){ redirectToLogin(); return; }
        console.error('Errore nel salvataggio della collezione', e);
        showNotice('Non sono riuscito a salvare i dati sul server.');
      });
  }

  function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function touchShow(show){
    show.lastModifiedAt = Date.now();
  }

  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return Math.abs(h) % 360;
  }

  const STATUS_LABELS = {
    planned: 'Da vedere',
    watching: 'In corso',
    completed: 'Completato',
    dropped: 'Abbandonato'
  };

  function computeProgress(show){
    let total = 0, watched = 0;
    show.seasons.forEach(se => {
      total += se.episodeCount;
      watched += se.watched.filter(Boolean).length;
    });
    return {total, watched, pct: total ? Math.round((watched/total)*100) : 0};
  }

  const DROP_THRESHOLD_MS = 30 * 24 * 60 * 60 * 1000; // 30 giorni

  function computeStatus(show){
    const {total, watched} = computeProgress(show);
    if(total === 0 || watched === 0) return 'planned';
    if(watched >= total) return 'completed';
    // stato intermedio: in corso, a meno che non sia inattivo da 30+ giorni
    const last = show.lastModifiedAt || 0;
    if(Date.now() - last > DROP_THRESHOLD_MS) return 'dropped';
    return 'watching';
  }

  // Trova il primo episodio non ancora segnato come visto, per sapere "a che punto" si è rimasti.
  function getNextEpisode(show){
    for(let si = 0; si < show.seasons.length; si++){
      const se = show.seasons[si];
      for(let ei = 0; ei < se.watched.length; ei++){
        if(!se.watched[ei]) return { season: si + 1, episode: ei + 1 };
      }
    }
    return null;
  }

  function filterByMedia(list, media){
    if(media === 'all') return list;
    return list.filter(s => s.type === media);
  }

  function createShowCard(show){
    const hue = hashHue(show.title);
    const {total, watched, pct} = computeProgress(show);
    const statusKey = computeStatus(show);
    const isFilm = show.type === 'film';
    const expanded = isFilm ? false : isCardExpanded(show);
    const card = document.createElement('div');
    card.className = 'card' + (isFilm ? ' film-card' : (expanded ? ' expanded' : ' collapsed'));

    const head = document.createElement('div');
    head.className = 'card-head';
    head.style.background = `linear-gradient(135deg, hsla(${hue},45%,22%,1), hsla(${(hue+40)%360},35%,14%,1))`;

    head.innerHTML = `
      <div class="card-top-row">
        <div class="title-row${isFilm ? ' no-expand' : ''}"${isFilm ? '' : ' data-action="toggle-expand" title="' + (expanded ? 'Comprimi' : 'Espandi') + ' stagioni ed episodi"'}>
          ${isFilm ? '' : '<span class="chevron">▾</span>'}
          <div>
            <span class="type-badge ${show.type}">${show.type === 'serie' ? 'Serie TV' : 'Film'}</span>
            <h3>${escapeHtml(show.title)}</h3>
          </div>
        </div>
        <div class="card-top-actions">
          <button class="heart-btn ${show.favorite ? 'on' : ''}" title="${show.favorite ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}" data-action="toggle-favorite">${show.favorite ? '♥' : '♡'}</button>
          <button class="icon-btn" title="Elimina" data-action="delete">✕</button>
        </div>
      </div>
      ${isFilm ? '' : `<span class="tile-progress">${watched}/${total} · ${pct}%</span>`}
      <div class="meta-row">
        <span class="status-badge ${statusKey}">${STATUS_LABELS[statusKey]}</span>
        ${show.episodeRuntime ? `<span class="runtime-badge">⏱ ${show.episodeRuntime} min${isFilm ? '' : '/ep'}</span>` : ''}
        <div class="stars" data-action="stars">
          ${[1,2,3,4,5].map(n => `<button class="star ${show.rating>=n?'on':''}" data-star="${n}">★</button>`).join('')}
        </div>
      </div>
    `;

    const body = document.createElement('div');
    body.className = 'card-body';

    if(isFilm){
      const isWatched = !!(show.seasons[0] && show.seasons[0].watched[0]);
      body.innerHTML = `
        <label class="film-watch-row">
          <input type="checkbox" class="film-watch-checkbox" ${isWatched ? 'checked' : ''}>
          <span>${isWatched ? 'Visto' : 'Segna come visto'}</span>
        </label>
      `;
    } else {
      const seasonsHtml = show.seasons.map((se, sIdx) => `
        <div class="season-row" data-season="${sIdx}">
          <div class="season-label-row">
            <div class="season-tag-wrap">
              <span class="season-tag">${escapeHtml(se.name && se.name.trim() ? se.name.trim() : 'S' + String(sIdx+1).padStart(2,'0'))}</span>
              <button class="season-name-btn" data-action="season-rename" title="Rinomina stagione">✏</button>
            </div>
            <div class="season-tools">
              <button class="mark-all-on" data-action="mark-all-watched" title="Segna tutti gli episodi come visti">✓✓</button>
              <button class="mark-all-off" data-action="mark-all-unwatched" title="Segna tutti gli episodi come non visti">○○</button>
              <button data-action="ep-minus" title="Rimuovi un episodio">−</button>
              <input type="number" class="ep-count" data-action="ep-count" value="${se.episodeCount}" min="1" max="999" title="Numero episodi">
              ${show.seasons.length > 1 ? '<button data-action="season-remove" title="Rimuovi stagione">🗑</button>' : ''}
            </div>
          </div>
          <div class="punch-grid">
            ${se.watched.map((w, eIdx) => `<button class="square ${w?'watched':''}" data-ep="${eIdx}" title="Episodio ${eIdx+1}"></button>`).join('')}
          </div>
        </div>
      `).join('');

      body.innerHTML = (expanded ? seasonsHtml : '') + `
        <div class="progress-line"><span>${watched}/${total} episodi</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      `;
    }

    card.appendChild(head);
    card.appendChild(body);

    // event wiring
    const expandTrigger = head.querySelector('[data-action="toggle-expand"]');
    if(expandTrigger) expandTrigger.onclick = () => {
      if(toggledIds.has(show.id)) toggledIds.delete(show.id);
      else toggledIds.add(show.id);
      render();
    };
    head.querySelector('[data-action="toggle-favorite"]').onclick = () => {
      show.favorite = !show.favorite;
      touchShow(show);
      saveShows(); render();
    };
    head.querySelector('[data-action="delete"]').onclick = () => {
      showConfirm(`Eliminare "${show.title}" dalla videoteca?`, () => {
        shows = shows.filter(s => s.id !== show.id);
        saveShows(); render();
      });
    };
    head.querySelectorAll('[data-star]').forEach(starBtn => {
      starBtn.onclick = () => {
        const n = parseInt(starBtn.dataset.star, 10);
        show.rating = show.rating === n ? 0 : n;
        touchShow(show);
        saveShows(); render();
      };
    });

    if(isFilm){
      const checkbox = body.querySelector('.film-watch-checkbox');
      checkbox.onchange = () => {
        const se = show.seasons[0];
        const wasWatched = se.watched[0];
        se.watched[0] = checkbox.checked;
        touchShow(show);
        saveShows();
        if(checkbox.checked && !wasWatched){
          celebrate('film', show.title);
        }
        render();
      };
    }

    body.querySelectorAll('.season-row').forEach(row => {
      const sIdx = parseInt(row.dataset.season, 10);
      const se = show.seasons[sIdx];

      row.querySelectorAll('[data-ep]').forEach(sq => {
        sq.onclick = () => {
          const eIdx = parseInt(sq.dataset.ep, 10);
          const wasSeasonComplete = se.watched.every(Boolean);
          const wasSeriesComplete = show.type === 'serie' && show.seasons.every(s2 => s2.watched.every(Boolean));

          se.watched[eIdx] = !se.watched[eIdx];
          const nowWatched = se.watched[eIdx];
          touchShow(show);
          saveShows();

          if(nowWatched){
            if(show.type === 'film'){
              celebrate('film', show.title);
            } else {
              const isSeasonComplete = se.watched.every(Boolean);
              const isSeriesComplete = show.seasons.every(s2 => s2.watched.every(Boolean));
              if(isSeriesComplete && !wasSeriesComplete){
                celebrate('series', show.title);
              } else if(isSeasonComplete && !wasSeasonComplete){
                celebrate('season', show.title);
              }
            }
          }
          render();
        };
      });

      function setEpisodeCount(newCount){
        newCount = Math.max(1, Math.min(999, Math.round(newCount) || 1));
        if(newCount === se.episodeCount) return;
        if(newCount > se.episodeCount){
          while(se.watched.length < newCount) se.watched.push(false);
        } else {
          se.watched = se.watched.slice(0, newCount);
        }
        se.episodeCount = newCount;
        touchShow(show);
        saveShows(); render();
      }

      const minusBtn = row.querySelector('[data-action="ep-minus"]');
      if(minusBtn) minusBtn.onclick = () => {
        if(se.episodeCount > 1) setEpisodeCount(se.episodeCount - 1);
      };

      const countInput = row.querySelector('[data-action="ep-count"]');
      if(countInput){
        countInput.onchange = () => setEpisodeCount(parseInt(countInput.value, 10));
        countInput.onkeydown = (e) => { if(e.key === 'Enter') countInput.blur(); };
      }

      const renameBtn = row.querySelector('[data-action="season-rename"]');
      if(renameBtn) renameBtn.onclick = () => {
        const current = se.name && se.name.trim() ? se.name.trim() : (show.type === 'serie' ? 'Stagione ' + (sIdx+1) : 'Film');
        const name = prompt('Nome della stagione:', current);
        if(name === null) return;
        se.name = name.trim();
        touchShow(show);
        saveShows(); render();
      };

      const markAllWatchedBtn = row.querySelector('[data-action="mark-all-watched"]');
      if(markAllWatchedBtn) markAllWatchedBtn.onclick = () => {
        const wasSeasonComplete = se.watched.every(Boolean);
        const wasSeriesComplete = show.type === 'serie' && show.seasons.every(s2 => s2.watched.every(Boolean));
        se.watched = se.watched.map(() => true);
        touchShow(show);
        saveShows();
        if(show.type === 'film'){
          celebrate('film', show.title);
        } else {
          const isSeriesComplete = show.seasons.every(s2 => s2.watched.every(Boolean));
          if(isSeriesComplete && !wasSeriesComplete){
            celebrate('series', show.title);
          } else if(!wasSeasonComplete){
            celebrate('season', show.title);
          }
        }
        render();
      };

      const markAllUnwatchedBtn = row.querySelector('[data-action="mark-all-unwatched"]');
      if(markAllUnwatchedBtn) markAllUnwatchedBtn.onclick = () => {
        se.watched = se.watched.map(() => false);
        touchShow(show);
        saveShows(); render();
      };

      const removeBtn = row.querySelector('[data-action="season-remove"]');
      if(removeBtn) removeBtn.onclick = () => {
        show.seasons.splice(sIdx, 1);
        touchShow(show);
        saveShows(); render();
      };
    });

    return card;
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.className = 'grid';

    if(mediaFilter === 'all'){
      grid.style.display = 'none';
      return;
    }
    grid.style.display = '';

    const list = filterByMedia(shows, mediaFilter);

    if(list.length === 0){
      grid.innerHTML = '<div class="empty" style="grid-column: 1/-1;"><h2>Scaffale vuoto</h2><p>Aggiungi il tuo primo titolo per iniziare a tracciare.</p></div>';
      return;
    }

    list.forEach(show => grid.appendChild(createShowCard(show)));
  }

  function buildFavoriteCard(show){
    const hue = hashHue(show.title);
    const gradient = `linear-gradient(160deg, hsla(${hue},45%,26%,1), hsla(${(hue+40)%360},35%,14%,1))`;

    const card = document.createElement('div');
    card.className = 'fav-card';

    const badges = [];
    if(show.rating > 0) badges.push(`<span class="fav-rating">★ ${show.rating}/5</span>`);
    if(show.episodeRuntime) badges.push(`<span class="fav-runtime">⏱ ${show.episodeRuntime} min</span>`);

    card.innerHTML = `
      <div class="fav-poster" style="background:${gradient};">
        ${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : ''}
        <button class="fav-remove" title="Rimuovi dai preferiti" data-action="unfavorite">♥</button>
      </div>
      ${badges.length ? `<div class="fav-meta">${badges.join('')}</div>` : ''}
      <div class="fav-title">${escapeHtml(show.title)}</div>
    `;

    card.querySelector('[data-action="unfavorite"]').onclick = () => {
      show.favorite = false;
      touchShow(show);
      saveShows(); render();
    };

    return card;
  }

  // Trova, all'interno della stagione che si sta guardando, gli episodi ancora da vedere
  // dopo quello corrente (fino alla fine della stagione, con un tetto per non allungarsi
  // all'infinito su stagioni molto lunghe).
  function getUpcomingEpisodesInSeason(show, limit){
    const next = getNextEpisode(show);
    if(!next) return { season: null, episodes: [], remaining: 0 };
    const season = show.seasons[next.season - 1];
    const episodeNumbers = [];
    for(let ei = next.episode; ei < season.watched.length; ei++){
      episodeNumbers.push(ei + 1); // il prossimo da vedere (next.episode) è già mostrato nell'hero
    }
    return {
      season: next.season,
      episodes: episodeNumbers.slice(0, limit),
      remaining: Math.max(0, episodeNumbers.length - limit)
    };
  }

  // Mostra in grande la serie "in corso" con il voto più alto (S{n} · E{n} da vedere),
  // di fianco gli episodi successivi della stagione che si sta guardando e, ancora
  // di fianco, la lista compatta delle altre serie in corso.
  function renderNowWatching(){
    const section = document.getElementById('nowWatchingSection');
    const hero = document.getElementById('nowWatchingHero');
    const episodesEl = document.getElementById('nowWatchingEpisodes');
    const items = document.getElementById('nowWatchingItems');

    if(mediaFilter !== 'all'){
      section.style.display = 'none';
      hero.innerHTML = '';
      episodesEl.innerHTML = '';
      items.innerHTML = '';
      return;
    }

    const watching = shows
      .filter(s => s.type === 'serie' && computeStatus(s) === 'watching')
      .sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.lastModifiedAt || 0) - (a.lastModifiedAt || 0));

    if(watching.length === 0){
      section.style.display = 'none';
      hero.innerHTML = '';
      episodesEl.innerHTML = '';
      items.innerHTML = '';
      return;
    }
    section.style.display = 'flex';

    const [current, ...rest] = watching;
    const {total, watched} = computeProgress(current);
    const next = getNextEpisode(current);

    const heroImage = current.backdropUrl || current.posterUrl;
    hero.style.backgroundImage = heroImage ? `url("${heroImage}")` : 'none';
    hero.innerHTML = `
      <div class="now-watching-hero-content">
        <div class="now-watching-year">In corso</div>
        <h2>${escapeHtml(current.title)}</h2>
        <div class="now-watching-episode-subtitle" id="nowWatchingHeroEpisodeName"></div>
        <div class="now-watching-hero-meta">
          <span class="status-badge watching">${STATUS_LABELS.watching}</span>
          ${next ? `<span class="now-watching-progress">Stagione ${next.season} · Episodio ${next.episode}</span>` : ''}
          <span class="now-watching-progress">${watched}/${total} episodi</span>
          ${current.episodeRuntime ? `<span class="runtime-badge">⏱ ${current.episodeRuntime} min/ep</span>` : ''}
          ${current.rating > 0 ? `<div class="stars">${[1,2,3,4,5].map(n => `<span class="star ${current.rating>=n?'on':''}">★</span>`).join('')}</div>` : ''}
        </div>
      </div>
    `;

    // ---- In corso (le altre serie, di fianco a "Episodi successivi") ----
    if(rest.length === 0){
      items.innerHTML = '<div class="now-watching-empty-side">Nessun\'altra serie in corso al momento.</div>';
    } else {
      items.innerHTML = '';
      rest.slice(0, 4).forEach(show => {
        const {total: t, watched: w} = computeProgress(show);
        const n = getNextEpisode(show);
        const row = document.createElement('div');
        row.className = 'now-watching-item';
        row.innerHTML = `
          <div class="now-watching-item-poster">${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : ''}</div>
          <div class="now-watching-item-info">
            <div class="now-watching-item-title">${escapeHtml(show.title)}</div>
            <div class="now-watching-item-progress">${n ? `S${n.season} · E${n.episode}` : ''}${n ? ' · ' : ''}${w}/${t}</div>
          </div>
        `;
        items.appendChild(row);
      });
    }

    // ---- Episodi successivi (della stagione della serie mostrata in grande) ----
    const upcoming = getUpcomingEpisodesInSeason(current, 3);
    const rowRefsByEpisode = {};
    if(!next || upcoming.episodes.length === 0){
      episodesEl.innerHTML = '<div class="now-watching-empty-side">Nessun altro episodio da vedere in questa stagione.</div>';
    } else {
      episodesEl.innerHTML = '';
      upcoming.episodes.forEach(epNumber => {
        const row = document.createElement('div');
        row.className = 'now-watching-episode';
        row.innerHTML = `
          <div class="now-watching-episode-still" aria-hidden="true"></div>
          <div class="now-watching-episode-info">
            <div class="now-watching-episode-top">
              <span class="now-watching-episode-num">E${epNumber}</span>
              <span class="now-watching-episode-label">Episodio ${epNumber}</span>
            </div>
            <span class="now-watching-episode-runtime">${current.episodeRuntime ? current.episodeRuntime + ' min' : ''}</span>
          </div>
        `;
        episodesEl.appendChild(row);
        rowRefsByEpisode[epNumber] = {
          still: row.querySelector('.now-watching-episode-still'),
          label: row.querySelector('.now-watching-episode-label'),
          runtime: row.querySelector('.now-watching-episode-runtime')
        };
      });
      if(upcoming.remaining > 0){
        const more = document.createElement('div');
        more.className = 'now-watching-episode-more';
        more.textContent = `+${upcoming.remaining} altri episodi in questa stagione`;
        episodesEl.appendChild(more);
      }
    }

    // Sostituisce le etichette generiche con nome, durata e immagine di anteprima veri,
    // sia nella preview grande (episodio in corso) sia nella lista "Episodi successivi",
    // appena disponibili da TMDB. Se la serie non ha ancora un tmdbId salvato (aggiunta
    // prima di questa funzione), prova prima a recuperarlo cercando il titolo; se anche
    // questo fallisce, o TMDB non ha il dato, restano le etichette generiche senza rompere nulla.
    if(next){
      resolveTmdbId(current).then(tvId => {
        if(!tvId) return;
        return getSeasonEpisodeNames(tvId, next.season).then(episodesData => {
          if(!episodesData) return;

          const heroEpisode = episodesData[next.episode];
          if(heroEpisode && heroEpisode.name){
            const heroSubtitleEl = document.getElementById('nowWatchingHeroEpisodeName');
            if(heroSubtitleEl) heroSubtitleEl.textContent = heroEpisode.name;
          }

          Object.keys(rowRefsByEpisode).forEach(epNumber => {
            const data = episodesData[epNumber];
            if(!data) return;
            const refs = rowRefsByEpisode[epNumber];
            if(data.name) refs.label.textContent = data.name;
            if(data.stillUrl) refs.still.innerHTML = `<img src="${data.stillUrl}" alt="" loading="lazy">`;
            const runtimeMin = data.runtime || current.episodeRuntime;
            if(runtimeMin) refs.runtime.textContent = runtimeMin + ' min';
          });
        });
      });
    }
  }

  function renderFavorites(){
    const section = document.getElementById('favoritesSection');
    const carousel = document.getElementById('favoritesGrid');
    const countEl = document.getElementById('favoritesCount');
    const favorites = filterByMedia(shows.filter(s => s.favorite), mediaFilter);

    if(favorites.length === 0){
      section.style.display = 'none';
      carousel.innerHTML = '';
      return;
    }

    section.style.display = 'block';
    countEl.textContent = favorites.length;
    carousel.innerHTML = '';
    favorites.forEach(show => carousel.appendChild(buildFavoriteCard(show)));
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(){
    renderNowWatching();
    renderFavorites();
    renderGenres();
    renderTrending();
    renderGrid();
  }

  // ---------- Ricerca online (TMDB) ----------
  const onlineSearchForm = document.getElementById('onlineSearchForm');
  const onlineSearchInput = document.getElementById('onlineSearchInput');
  const onlineSearchLive = document.getElementById('onlineSearchLive');
  let liveSearchDebounce = null;
  let liveSearchToken = 0;

  function mediaTypeLabel(mediaType){
    return mediaType === 'movie' ? 'Film' : 'Serie TV';
  }

  function closeLiveResults(){
    onlineSearchLive.style.display = 'none';
    onlineSearchLive.innerHTML = '';
  }

  async function fetchCombinedResults(query){
    let tmdbList;
    try{
      tmdbList = await apiFetch('/catalog/search?query=' + encodeURIComponent(query));
    }catch(e){
      if(e.status === 401){ redirectToLogin(); }
      throw e;
    }
    return tmdbList || [];
  }

  function buildResultRow(r){
    const item = document.createElement('div');
    item.className = 'online-search-result';
    item.innerHTML = `
      <div class="online-search-poster">${r.posterUrl ? `<img src="${r.posterUrl}" alt="">` : '🎬'}</div>
      <div class="online-search-info">
        <div class="online-search-title">${escapeHtml(r.title)}${r.year ? ' <span class="online-search-year">(' + escapeHtml(r.year) + ')</span>' : ''}</div>
        <span class="type-badge ${r.mediaType === 'movie' ? 'film' : 'serie'}">${mediaTypeLabel(r.mediaType)}</span>
      </div>
      <button type="button" class="btn primary online-search-add">+ Aggiungi</button>
    `;
    item.querySelector('.online-search-add').onclick = (e) => { e.stopPropagation(); addFromOnlineSearch(r, item); };
    return item;
  }

  // Suggerimenti live mentre si scrive
  onlineSearchInput.addEventListener('input', () => {
    const query = onlineSearchInput.value.trim();
    clearTimeout(liveSearchDebounce);

    if(!query){
      closeLiveResults();
      return;
    }

    liveSearchDebounce = setTimeout(async () => {
      const myToken = ++liveSearchToken;
      onlineSearchLive.style.display = 'block';
      onlineSearchLive.innerHTML = '<div class="online-search-status">Ricerca in corso…</div>';

      let results;
      try{
        results = await fetchCombinedResults(query);
      }catch(e){
        if(myToken !== liveSearchToken) return;
        onlineSearchLive.innerHTML = '<div class="online-search-status">' + escapeHtml(e.message || 'Errore durante la ricerca.') + '</div>';
        return;
      }
      if(myToken !== liveSearchToken) return; // arrivata una ricerca più recente nel frattempo

      if(!results || results.length === 0){
        onlineSearchLive.innerHTML = '<div class="online-search-status">Nessun risultato per "' + escapeHtml(query) + '".</div>';
        return;
      }

      onlineSearchLive.innerHTML = '';
      results.slice(0, 6).forEach(r => onlineSearchLive.appendChild(buildResultRow(r)));

      const seeAll = document.createElement('button');
      seeAll.type = 'button';
      seeAll.className = 'online-search-see-all';
      seeAll.textContent = 'Vedi tutti i risultati per "' + query + '" →';
      seeAll.onclick = () => goToSearchPage(query);
      onlineSearchLive.appendChild(seeAll);
    }, 350);
  });

  function goToSearchPage(query){
    closeLiveResults();
    window.location.href = 'search.html?q=' + encodeURIComponent(query);
  }

  onlineSearchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = onlineSearchInput.value.trim();
    if(!query){ showNotice('Scrivi qualcosa da cercare.'); return; }
    goToSearchPage(query);
  });

  // Chiude la tendina se si clicca fuori
  document.addEventListener('click', (e) => {
    if(!onlineSearchForm.contains(e.target)) closeLiveResults();
  });

  async function addFromOnlineSearch(result, itemEl){
    const addBtn = itemEl.querySelector('.online-search-add');
    addBtn.disabled = true;
    addBtn.textContent = 'Attendere…';

    const detailsPath = '/catalog/details?id=' + result.tmdbId + '&type=' + result.mediaType;

    let details;
    try{
      details = await apiFetch(detailsPath);
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      showNotice('Impossibile recuperare i dettagli: ' + e.message);
      addBtn.disabled = false;
      addBtn.textContent = '+ Aggiungi';
      return;
    }

    shows.unshift({
      id: uid(),
      title: details.title,
      type: details.type,
      rating: 0,
      favorite: false,
      episodeRuntime: details.episodeRuntime || null,
      posterUrl: details.posterUrl || result.posterUrl || null,
      backdropUrl: details.backdropUrl || null,
      tmdbId: result.mediaType === 'tv' ? result.tmdbId : null,
      lastModifiedAt: Date.now(),
      seasons: details.seasons
    });
    saveShows();
    render();

    showNotice('"' + details.title + '" aggiunto alla videoteca.');
    addBtn.textContent = '✓ Aggiunto';
  }

  // ---------- Barra di navigazione in alto ----------
  function setActiveNavLink(link){
    document.querySelectorAll('.topnav-link').forEach(a => a.classList.remove('active'));
    link.classList.add('active');
  }

  document.getElementById('navBoard').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'all'; render();
    setActiveNavLink(e.currentTarget);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('navMovies').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'film'; render();
    setActiveNavLink(e.currentTarget);
    document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  document.getElementById('navSeries').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'serie'; render();
    setActiveNavLink(e.currentTarget);
    document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  document.getElementById('navStats').onclick = (e) => {
    e.preventDefault();
    showNotice('La pagina Statistiche sarà disponibile in futuro.');
  };

  // ---------- Favorites carousel arrows ----------
  document.getElementById('favoritesPrev').onclick = () => {
    document.getElementById('favoritesGrid').scrollBy({ left: -320, behavior: 'smooth' });
  };
  document.getElementById('favoritesNext').onclick = () => {
    document.getElementById('favoritesGrid').scrollBy({ left: 320, behavior: 'smooth' });
  };

  // ---------- Sessione / Logout ----------
  const authUser = getStoredUsername();
  const sessionUserName = document.getElementById('sessionUserName');
  if (sessionUserName) sessionUserName.textContent = authUser || '';

  // ---------- Avatar ----------
  const avatarImg = document.getElementById('avatarImg');
  const avatarInitial = document.getElementById('avatarInitial');
  const avatarInput = document.getElementById('avatarInput');

  function displayAvatar(dataUrl, usernameForInitial){
    if(dataUrl){
      avatarImg.src = dataUrl;
      avatarImg.style.display = 'block';
      avatarInitial.style.display = 'none';
    } else {
      avatarImg.style.display = 'none';
      avatarInitial.style.display = 'flex';
      avatarInitial.textContent = (usernameForInitial || '?').trim().charAt(0).toUpperCase();
    }
  }

  async function loadAccountInfo(){
    try{
      const me = await apiFetch('/me');
      if(me && me.username && sessionUserName) sessionUserName.textContent = me.username;
      displayAvatar(me ? me.avatar : null, me ? me.username : authUser);
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      displayAvatar(null, authUser);
    }
  }

  if(avatarInput) avatarInput.onchange = () => {
    const file = avatarInput.files && avatarInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        apiFetch('/me/avatar', { method:'PUT', body: JSON.stringify({ avatar: dataUrl }) })
          .then(() => displayAvatar(dataUrl, authUser))
          .catch(err => showNotice('Non sono riuscito a salvare la foto: ' + err.message));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    avatarInput.value = '';
  };

  // ---------- Init ----------
  async function init(){
    await loadShows();
    render();
    loadAccountInfo();
  }
  init();
})();
</script>
</body>
</html>
